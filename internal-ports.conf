# HAProxy INTERNAL allowed ports (allow-for-registration, NOT host-published).
#
# Unlike allowed-ports.conf, ports listed here are added to the Registration API's
# ALLOWED_PORTS allowlist but are NOT `-p` published on the host by run-haproxy.sh.
# Use for services that expose ports only INSIDE haproxy-net.
#
# Format: one port per line, or ranges with dash (e.g. 21000-21099). '#' comments ok.
# After changing this file, restart HAProxy: ./run-haproxy.sh

# ─── Staging SSH reverse-tunnel ports (see staging-tunnel/) ───────────────────
# Firewalled dev backends bind one of these on the staging-tunnel container via
# `ssh -R`; haproxy routes <feature>.staging.<base> :443 to staging-tunnel:<port>.
21000-21099
