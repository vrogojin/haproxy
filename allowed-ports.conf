# HAProxy Allowed Ports Configuration
#
# Ports listed here are published on the host at HAProxy container startup
# and are the ONLY ports that services can register via the Registration API.
#
# Format: one port per line, or ranges with dash (e.g., 50001-50004)
# Lines starting with # are comments. Blank lines are ignored.
#
# The base ports (80, 443, 8404) are always published and don't need listing.
# Port 8000 is the stats/admin UI.
#
# Add ports here for each service that will register with HAProxy.
# After changing this file, restart HAProxy: ./run-haproxy.sh

# ─── Admin / Stats ───────────────────────────────────────────────────────────
8000

# ─── Fulcrum-Alpha (Electrum protocol) ───────────────────────────────────────
50001-50004

# ─── UniQuake (game server) ──────────────────────────────────────────────────
9000        # Content HTTP
9001        # Content HTTPS
27950       # Master WS
27951       # Master WSS

# ─── IPFS Storage ────────────────────────────────────────────────────────────
4001        # Swarm TCP
4003        # WSS
9080        # HTTP gateway

# ─── Other services ──────────────────────────────────────────────────────────
3443        # Friendly Miners HTTPS
8888        # Game server (LGSM)
