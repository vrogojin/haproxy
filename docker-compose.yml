services:
  haproxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haproxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
      - "50001-50004:50001-50004"
      # Port 8404 is NOT published -- API is internal only
    volumes:
      - haproxy-data:/etc/haproxy
    networks:
      - haproxy-net

volumes:
  haproxy-data:

networks:
  haproxy-net:
    external: true
