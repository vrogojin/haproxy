global
    log stdout format raw local0
    maxconn 4096
    hard-stop-after 30s
    stats socket /var/run/haproxy.sock mode 660 level admin

defaults
    log global
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    retries 3
    option redispatch

# raised for long-lived voice/streaming turns (SSE-heartbeat backstop, 2026-07)
    timeout tunnel 300s
