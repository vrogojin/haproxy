# =============================================================================
# DNS resolvers — self-healing for dynamic Docker backends
# =============================================================================
# Uses Docker's embedded DNS server (127.0.0.11) so that every dynamically
# registered backend server (see 20-backends.cfg) is *periodically re-resolved*.
#
# Why this exists:
#   Backend containers share this haproxy but have their own lifecycles. When
#   the host reboots, haproxy (restart=unless-stopped) can come back BEFORE the
#   backends. With `init-addr last,libc,none` and NO resolvers section, a server
#   whose DNS name does not resolve at startup is parked in `MAINT (resolution)`
#   and can NEVER leave it without a full config reload — even after the backend
#   returns, listening on the right IP. Every staging HTTPS domain then returns
#   an instant TLS close (000).
#
#   With a resolvers section attached to each server, haproxy keeps re-resolving
#   the hostname in the background; the moment the container is back in DNS the
#   health-check brings the server UP again automatically — no reload needed.
#
# The `hold` timers are deliberately short so recovery is fast (a rebooted host
# heals within a few seconds of the backend re-appearing in Docker DNS), while
# still cheap for the embedded resolver.
resolvers docker
    nameserver docker 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry  1s
    # How long to trust each class of DNS answer before re-querying.
    hold valid    10s
    hold nx        5s
    hold refused   5s
    hold timeout   5s
    hold other     5s
    hold obsolete  5s
